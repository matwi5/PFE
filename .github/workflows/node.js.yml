name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.19.0]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: '18.19.0'
        cache: 'npm'
        # Définit le répertoire de travail où se trouve le fichier package-lock.json pour la mise en cache
        cache-dependency-path: pole_predict/

    - name: npm install, build, and test
      run: |
        cd pole_predict
        npm install
        npm run build --if-present
        npm run test --if-present
