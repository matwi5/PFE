name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.19.0]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: '18.19.0'
        cache: 'npm'
    - run: npm install
      working-directory: pole_predict # Spécifie le répertoire pour l'installation
    - run: npm run build --if-present
      working-directory: pole_predict # Spécifie le répertoire pour la compilation
    - run: npm run test --if-present
      working-directory: pole_predict # Spécifie le répertoire pour les tests
